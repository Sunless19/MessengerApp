server {
    listen 80;
    server_name localhost;

    # Set the root directory where your static files are located
    root /usr/share/nginx/html;

    # Specify the default file to serve
    index index.html index.htm;

    location / {
        # Try serving the requested file directly, then as a directory,
        # and finally fallback to serving index.html (for SPA routing)
        try_files $uri $uri/ /index.html;
    }
}